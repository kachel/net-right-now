<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicago Ham Zone</title>
    <meta name="description" content="Live status board for Chicagoland amateur radio nets — see what's on the air right now." />
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="hazard-strip" aria-hidden="true"></div>

    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="3" />
              <path d="M24 8V16" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
              <path
                d="M15 20C15 20 18 15 24 15C30 15 33 20 33 20"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
              />
              <path
                d="M11 26C11 26 16 19 24 19C32 19 37 26 37 26"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                opacity="0.55"
              />
              <circle cx="24" cy="32" r="3.5" fill="currentColor" />
            </svg>
          </div>
          <div class="brand-text">
            <h1 class="title">Chicago Ham Zone</h1>
            <p class="tagline">Live status board for Chicagoland amateur radio nets</p>
          </div>
        </div>

        <div class="status-clock" role="status" aria-live="off">
          <span class="status-clock-label">Local time</span>
          <span class="status-clock-value" id="cst-time">--:--:-- --</span>
        </div>
      </div>
    </header>

    <main>
      <section id="next-net" class="status-panel" aria-live="polite"></section>

      <section class="controls-panel" aria-label="Filter nets">
        <div class="controls-row controls-row-search">
          <div class="search-field">
            <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6" />
              <path d="M14 14L18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Search by net name or sponsor&hellip;"
              aria-label="Search nets by name or sponsor"
            />
          </div>

          <div class="location-filter-container" role="group" aria-label="Filter by location">
            <button class="chip location-filter-btn" data-filter="all">All Areas</button>
            <button class="chip location-filter-btn" data-filter="chicago">Chicago</button>
            <button class="chip location-filter-btn" data-filter="chicagoland">Chicagoland</button>
          </div>
        </div>

        <div class="controls-row">
          <span class="controls-label">Day</span>
          <div class="chip-group" id="day-filter-group" role="group" aria-label="Filter by day"></div>
        </div>

        <div class="controls-row">
          <span class="controls-label">Band</span>
          <div class="chip-group" id="band-filter-group" role="group" aria-label="Filter by band"></div>
        </div>
      </section>

      <section class="schedule-panel" aria-label="Full net schedule">
        <div class="schedule-header">
          <h2 class="title schedule-title">Full Schedule</h2>
          <div class="schedule-header-actions">
            <span class="result-count" id="result-count"></span>
            <button id="toggle-nets-btn" class="btn-toggle" aria-pressed="true" aria-expanded="true" aria-controls="nets-table-wrap">
              Hide Schedule
            </button>
          </div>
        </div>

        <div id="nets-table-wrap" class="table-wrap">
          <table class="nets-table" id="nets-table">
            <thead>
              <tr>
                <th scope="col" data-sort="day"><button class="th-btn">Day</button></th>
                <th scope="col" data-sort="time"><button class="th-btn">Time&nbsp;CST</button></th>
                <th scope="col" data-sort="name"><button class="th-btn">Net</button></th>
                <th scope="col" data-sort="sponsor"><button class="th-btn">Sponsor</button></th>
                <th scope="col" data-sort="frequency"><button class="th-btn">Freq</button></th>
                <th scope="col" data-sort="band"><button class="th-btn">Band</button></th>
                <th scope="col" data-sort="location"><button class="th-btn">Location</button></th>
              </tr>
            </thead>
            <tbody id="nets-tbody"></tbody>
          </table>
          <p id="no-results" class="no-results" hidden>No nets match your filters.</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <footer>
      <p>
        Made with love by <span class="title">KD9KUU</span> and <a href="/ai_disclosure.html">a lil AI</a>
      </p>
      <p>
        The information is based on this
        <a href="https://docs.google.com/spreadsheets/d/1YdopCuQOizD7iSrC_PO3Tnn62rknWkQM_FJ0ASDg1V8/edit?gid=0#gid=0"
          >spreadsheet</a
        >. Thank you Ben Straw <span class="title">KC9UNS</span>!
      </p>
    </footer>
  </body>
</html>
